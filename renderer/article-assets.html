<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'NotoSC';
    src: url('./assets/NotoSansSC-VF.ttf') format('truetype');
    font-weight: 100 900;
    font-display: block;
  }
  @font-face {
    font-family: 'NotoSerifSC';
    src: url('./assets/NotoSerifSC-VF.ttf') format('truetype');
    font-weight: 200 900;
    font-display: block;
  }
  :root {
    --paper: #F3EDE1;
    --ink: #101112;
    --red: #E5482C;
    --lime: #D9FF57;
    --orange: #FF6A3D;
    --muted: #7B7468;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { font-family: 'NotoSC', sans-serif; background: var(--paper); color: var(--ink); }
  #stage { width: 100vw; height: 100vh; overflow: hidden; }
  .asset { position: relative; width: 100%; height: 100%; padding: 46px 54px; overflow: hidden; }
  .asset.light { background: var(--paper); }
  .asset.dark { background: #0B0C0D; color: var(--paper); }
  .asset::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(16,17,18,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(16,17,18,.055) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: linear-gradient(120deg, #000, transparent 70%);
    mask-image: linear-gradient(120deg, #000, transparent 70%);
  }
  .asset.dark::before { background-image: radial-gradient(rgba(242,235,221,.16) 1px, transparent 1.4px); background-size: 30px 30px; opacity: .42; }
  .kicker { position: relative; z-index: 2; font-size: 15px; font-weight: 700; letter-spacing: .24em; color: var(--muted); }
  .asset.dark .kicker { color: rgba(242,235,221,.5); }
  h1, h2 { position: relative; z-index: 2; margin: 0; font-family: 'NotoSerifSC', serif; letter-spacing: -.04em; line-height: 1.18; font-weight: 900; }
  h1 { font-size: 52px; max-width: 760px; }
  h2 { font-size: 56px; max-width: 940px; }
  .accent { color: var(--red); }
  .lime { background: var(--lime); color: var(--ink); padding: 0 .1em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

  /* cover */
  .cover { padding: 34px 40px; background: var(--paper); }
  .cover .cover-top { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .24em; font-weight: 700; color: var(--muted); }
  .cover h1 { margin-top: 34px; font-size: 46px; max-width: 690px; }
  .cover .cover-bottom { position: absolute; left: 40px; right: 40px; bottom: 28px; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
  .cover .cover-tag { display: inline-block; background: var(--lime); border: 2px solid var(--ink); padding: 7px 12px; font-size: 17px; font-weight: 900; letter-spacing: .04em; box-shadow: 5px 5px 0 var(--ink); }
  .cover .cover-brand { font-size: 11px; font-weight: 800; letter-spacing: .22em; color: var(--muted); }
  .cover .cover-stamp { position: absolute; right: 46px; top: 86px; width: 116px; height: 142px; border: 2px dashed rgba(16,17,18,.55); transform: rotate(7deg); padding: 12px; font-family: 'NotoSerifSC', serif; font-size: 25px; font-weight: 900; line-height: 1.2; }
  .cover .cover-stamp span { color: var(--red); }
  .cover .cover-stamp::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 10px; height: 18px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 5px); opacity: .55; }
  .cover .cover-rule { position: absolute; left: 20px; top: 0; width: 10px; height: 128px; background: var(--red); }

  /* figure 1 */
  .flow { position: relative; z-index: 2; display: flex; align-items: center; gap: 24px; margin-top: 50px; }
  .envelope { width: 250px; height: 160px; border: 3px solid var(--ink); position: relative; flex: 0 0 250px; background: rgba(255,255,255,.18); overflow: hidden; }
  .envelope::before, .envelope::after { content: ''; position: absolute; left: 0; width: 100%; height: 3px; background: var(--ink); top: 50%; transform-origin: center; }
  .envelope::before { transform: rotate(32deg); }
  .envelope::after { transform: rotate(-32deg); }
  .envelope .addr { position: absolute; left: 14px; bottom: 12px; font-size: 11px; line-height: 1.5; font-weight: 650; letter-spacing: .08em; z-index: 2; background: var(--paper); padding: 3px 5px; }
  .envelope .addr em { display: block; font-style: normal; color: var(--red); font-size: 10px; }
  .flow-line { flex: 1; border-top: 3px dashed rgba(16,17,18,.3); position: relative; }
  .flow-line::after { content: '×'; position: absolute; right: -8px; top: -22px; color: var(--red); font-size: 34px; font-weight: 900; }
  .flow-label { position: absolute; left: 50%; top: -28px; transform: translateX(-50%); background: var(--paper); padding: 2px 10px; font-size: 12px; letter-spacing: .2em; color: var(--muted); white-space: nowrap; }
  .stamp { width: 180px; height: 180px; border: 4px solid var(--red); border-radius: 50%; color: var(--red); display: grid; place-content: center; text-align: center; transform: rotate(-10deg); flex: 0 0 180px; box-shadow: inset 0 0 0 8px var(--paper), inset 0 0 0 11px rgba(229,72,44,.55); }
  .stamp b { font-size: 46px; line-height: 1; letter-spacing: .06em; }
  .stamp small { display: block; margin-top: 7px; font-size: 11px; letter-spacing: .22em; }
  .callout-row { position: absolute; left: 54px; right: 54px; bottom: 42px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; z-index: 2; }
  .callout { background: var(--lime); border: 2px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); padding: 12px 18px; font-size: 40px; font-weight: 900; letter-spacing: -.04em; }
  .callout small { display: block; font-size: 11px; letter-spacing: .2em; font-weight: 700; margin-top: 4px; }
  .footnote { font-size: 14px; color: var(--muted); line-height: 1.6; max-width: 380px; }

  /* figure 2 */
  .two { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 40px; }
  .side { border: 1px solid rgba(242,235,221,.2); background: rgba(255,255,255,.035); padding: 22px 24px; min-height: 310px; position: relative; }
  .side .tag { font-size: 13px; font-weight: 800; letter-spacing: .16em; color: var(--red); }
  .side.ok .tag { color: var(--lime); }
  .side .big { margin-top: 28px; font-family: 'NotoSerifSC', serif; font-size: 40px; line-height: 1.35; font-weight: 900; }
  .side .desc { margin-top: 14px; font-size: 14px; line-height: 1.7; color: rgba(242,235,221,.55); }
  .side .badge { position: absolute; right: 18px; bottom: 18px; font-size: 12px; font-weight: 800; letter-spacing: .12em; color: var(--red); border: 2px solid var(--red); padding: 6px 10px; transform: rotate(-7deg); }
  .side.ok .badge { color: var(--lime); border-color: var(--lime); transform: rotate(5deg); }
  .side.ok { border-color: rgba(217,255,87,.45); }

  /* figure 3 */
  .checks { position: relative; z-index: 2; margin-top: 34px; display: flex; flex-direction: column; gap: 0; border-top: 2px solid var(--ink); }
  .check { display: flex; gap: 18px; align-items: flex-start; padding: 20px 0; border-bottom: 1px solid rgba(16,17,18,.2); }
  .check .n { font-family: 'NotoSerifSC', serif; font-size: 34px; font-weight: 900; color: var(--red); line-height: 1; width: 46px; flex: 0 0 46px; }
  .check .t { font-size: 24px; font-weight: 800; line-height: 1.45; }
  .check .s { margin-top: 4px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .bottom-line { position: absolute; left: 54px; right: 54px; bottom: 34px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
  .bottom-line .line { font-size: 15px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
  .bottom-line .mark { background: var(--ink); color: var(--lime); padding: 8px 12px; font-size: 13px; font-weight: 800; letter-spacing: .12em; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
  const stage = document.getElementById('stage');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function fitTitle(selector, max, min) {
    const el = document.querySelector(selector);
    if (!el) return;
    let size = max;
    el.style.fontSize = size + 'px';
    while (el.scrollHeight > el.clientHeight + 2 && size > min) {
      size -= 2;
      el.style.fontSize = size + 'px';
    }
  }

  const templates = {
    cover(d) {
      return `<div class="asset cover">
        <div class="cover-rule"></div>
        <div class="cover-top"><span>FIXED ADDRESS / 自动化发布</span><span>2026</span></div>
        <h1>${esc(d.title)}</h1>
        <div class="cover-stamp">固定<br><span>地址</span></div>
        <div class="cover-bottom"><span class="cover-tag">${esc(d.cover_text || '地址固定，才能自动发布')}</span><span class="cover-brand">CONTENT STUDIO</span></div>
      </div>`;
    },
    f1(d) {
      return `<div class="asset light">
        <div class="kicker">01 / 类比</div>
        <h2>${esc(d.h1 || '邮局只认登记过的门牌号')}</h2>
        <div class="flow">
          <div class="envelope"><div class="addr">TO: 微信邮局<br>ADDR: ???<em>ADDRESS CHANGED</em></div></div>
          <div class="flow-line"><span class="flow-label">地址每天在变</span></div>
          <div class="stamp"><b>退回</b><small>RETURN TO SENDER</small></div>
        </div>
        <div class="callout-row"><div class="callout">${esc(d.highlight || '固定公网 IP')}<small>STATIC PUBLIC IP</small></div><div class="footnote">${esc(d.footnote || '地址不固定，信就寄不到。')}</div></div>
      </div>`;
    },
    f2(d) {
      return `<div class="asset dark">
        <div class="kicker">02 / 对照</div>
        <h2>${esc(d.h2 || 'NAS 能干活，但地址每天在变')}</h2>
        <div class="two">
          <div class="side"><div class="tag">你家 · NAS</div><div class="big">地址<br>每天都在变</div><div class="desc">能干活，但家庭宽带的公网 IP 不稳定。平台不认。</div><div class="badge">邮局不认</div></div>
          <div class="side ok"><div class="tag">机房 · 云服务器</div><div class="big">地址<br>是固定的</div><div class="desc">固定 EIP，才能被平台登记，替你去对接。</div><div class="badge">可以投递</div></div>
        </div>
      </div>`;
    },
    f3(d) {
      return `<div class="asset light">
        <div class="kicker">03 / 行动</div>
        <h2>${esc(d.h3 || '今天就能做的 3 个检查')}</h2>
        <div class="checks">
          <div class="check"><div class="n">01</div><div><div class="t">公众号后台配置固定 IP 白名单</div><div class="s">不是内网 IP，是调用微信接口的公网出口。</div></div></div>
          <div class="check"><div class="n">02</div><div><div class="t">发布出口是不是固定 EIP</div><div class="s">NAS 的家庭宽带会变，云服务器 EIP 不会。</div></div></div>
          <div class="check"><div class="n">03</div><div><div class="t">失败重试有没有人/机器值守</div><div class="s">自动化不是跑起来，是每天固定时间都能跑。</div></div></div>
        </div>
        <div class="bottom-line"><span class="line">地址固定，才能自动抵达。</span><span class="mark">FIXED ADDRESS</span></div>
      </div>`;
    }
  };

  window.renderAsset = (mode, data) => {
    stage.innerHTML = templates[mode](data || {});
    document.body.dataset.mode = mode;
    if (mode === 'cover') fitTitle('.cover h1', 46, 28);
    if (mode === 'f2') fitTitle('.asset h2', 56, 36);
    return true;
  };
</script>
</body>
</html>
