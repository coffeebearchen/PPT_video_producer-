<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#101112" opacity=".16"/>
    </pattern>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#101112" stroke-width="1" opacity=".08"/>
    </pattern>
    <clipPath id="arch"><path d="M690 900V300c0-150 110-260 250-260s250 110 250 260v600z"/></clipPath>
  </defs>

  <rect width="1200" height="900" fill="#F3EDE1"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect width="1200" height="900" fill="url(#dots)" opacity=".55"/>

  <!-- red portal -->
  <path d="M690 900V300c0-150 110-260 250-260s250 110 250 260v600z" fill="#C73520"/>
  <g clip-path="url(#arch)" opacity=".14">
    <circle cx="990" cy="300" r="300" fill="none" stroke="#F3EDE1" stroke-width="2"/>
    <circle cx="990" cy="300" r="220" fill="none" stroke="#F3EDE1" stroke-width="2"/>
    <circle cx="990" cy="300" r="140" fill="none" stroke="#F3EDE1" stroke-width="2"/>
  </g>

  <!-- chat machine, left -->
  <g>
    <line x1="220" y1="180" x2="220" y2="96" stroke="#101112" stroke-width="9"/>
    <circle cx="220" cy="88" r="12" fill="#101112"/>
    <rect x="78" y="205" width="310" height="250" rx="28" fill="#101112"/>
    <rect x="102" y="229" width="262" height="182" rx="14" fill="#F3EDE1"/>
    <circle cx="180" cy="300" r="20" fill="#101112"/>
    <circle cx="265" cy="300" r="20" fill="#101112"/>
    <rect x="170" y="350" width="104" height="14" rx="7" fill="#101112"/>
    <rect x="135" y="455" width="195" height="42" rx="8" fill="#D9FF57" stroke="#101112" stroke-width="6"/>
    <g stroke="#101112" stroke-width="6" fill="none">
      <path d="M90 510v70h250v-70"/>
      <path d="M125 510v-34M305 510v-34"/>
    </g>
    <rect x="360" y="270" width="22" height="86" rx="8" fill="#C73520"/>
  </g>

  <!-- speech bubble -->
  <g>
    <path d="M430 190h230c26 0 46 20 46 46v92c0 26-20 46-46 46H520l-50 46 8-46h-48c-26 0-46-20-46-46v-92c0-26 20-46 46-46z" fill="#C73520" stroke="#101112" stroke-width="8"/>
    <circle cx="490" cy="280" r="13" fill="#F3EDE1"/>
    <circle cx="545" cy="280" r="13" fill="#F3EDE1"/>
    <circle cx="600" cy="280" r="13" fill="#F3EDE1"/>
  </g>

  <!-- action path -->
  <path d="M650 410 C760 410 720 560 820 560 S930 650 1010 650" fill="none" stroke="#101112" stroke-width="7" stroke-dasharray="4 16" stroke-linecap="round"/>
  <path d="M1000 640l24 10-18 18" fill="none" stroke="#101112" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- conveyor / workflow -->
  <g>
    <rect x="640" y="710" width="500" height="16" rx="8" fill="#101112"/>
    <circle cx="760" cy="718" r="20" fill="#F3EDE1" stroke="#101112" stroke-width="7"/>
    <circle cx="900" cy="718" r="20" fill="#F3EDE1" stroke="#101112" stroke-width="7"/>
    <circle cx="1040" cy="718" r="20" fill="#D9FF57" stroke="#101112" stroke-width="7"/>
    <rect x="742" y="650" width="36" height="36" rx="4" fill="#C73520" stroke="#101112" stroke-width="5"/>
    <rect x="882" y="650" width="36" height="36" rx="4" fill="#F3EDE1" stroke="#101112" stroke-width="5"/>
    <rect x="1022" y="650" width="36" height="36" rx="4" fill="#D9FF57" stroke="#101112" stroke-width="5"/>
  </g>

  <!-- agent figure -->
  <g>
    <circle cx="835" cy="420" r="44" fill="#E8A07A"/>
    <path d="M792 420c0-46 30-70 54-70 34 0 52 26 52 58-16-8-37-8-57 2-15 6-32 16-49 10z" fill="#101112"/>
    <path d="M812 458h48l12 92h-74z" fill="#F3EDE1" stroke="#101112" stroke-width="6"/>
    <path d="M815 545h52l22 150h-38l-18-94-10 94h-38z" fill="#C73520" stroke="#101112" stroke-width="6"/>
    <path d="M812 472c-30 10-44 32-52 58" fill="none" stroke="#101112" stroke-width="13" stroke-linecap="round"/>
    <path d="M866 472c30 10 42 26 48 48" fill="none" stroke="#101112" stroke-width="13" stroke-linecap="round"/>
    <path d="M900 515l-12 45" fill="none" stroke="#101112" stroke-width="6"/>
    <rect x="700" y="525" width="88" height="70" rx="4" fill="#101112"/>
    <path d="M714 525v-18h60v18" fill="none" stroke="#101112" stroke-width="5"/>
    <path d="M716 548h56M716 566h42" stroke="#F3EDE1" stroke-width="5"/>
    <path d="M780 560c20 8 36 22 48 40" fill="none" stroke="#101112" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- small marks -->
  <g fill="#101112">
    <path d="M118 760h42v42h-42z" opacity=".9"/>
    <path d="M132 770l24 24M156 770l-24 24" stroke="#F3EDE1" stroke-width="5"/>
    <circle cx="1080" cy="120" r="8" fill="#D9FF57"/>
    <path d="M1060 160l20-20 20 20" fill="none" stroke="#F3EDE1" stroke-width="4"/>
  </g>

  <!-- footer rule -->
  <path d="M60 830h480" stroke="#101112" stroke-width="2" opacity=".3"/>
</svg>
